<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>آفلاین | استودیو StyleGram</title>
  <style>
    body {
      margin: 0;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #011728;
      color: #EFEFEF;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      padding: 20px;
      text-align: center;
    }
    .card {
      max-width: 380px;
      padding: 28px 22px;
      border-radius: 22px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(0, 217, 255, 0.35);
    }
    h1 { margin: 0 0 10px; font-size: 1.2rem; color: #00D9FF; }
    p { margin: 0 0 18px; font-size: 0.9rem; line-height: 1.7; color: #94B2C9; }
    button {
      border: none;
      border-radius: 12px;
      padding: 11px 22px;
      background: linear-gradient(135deg, #0B82F6, #8B35FF);
      color: #fff;
      font-weight: 700;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>اتصال اینترنت برقرار نیست</h1>
    <p>نسخه اصلی StyleGram در حافظه دستگاه ذخیره شده است. برای بارگذاری مجدد صفحه اصلی دکمه زیر را بزنید.</p>
    <button onclick="window.location.href='./index.html'">بازگشت به استودیو</button>
  </div>
</body>
</html>
